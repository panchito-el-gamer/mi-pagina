<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Bolita Roja</title>
<style>
:root{--bg:#0b0e1a;--fg:#fff;--pn:rgba(24,30,52,.94);--ov:rgba(10,14,26,.9);--bt:#ff2a2a;--bt2:#ff7b00;--ac:#ffd60a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:radial-gradient(circle at 50% 30%,#273259 0%,#090c16 100%);color:var(--fg);overflow:hidden;font-family:system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;box-shadow:0 0 0 2px rgba(255,214,10,.25),0 14px 48px rgba(0,0,0,.8);border-radius:8px}
.b{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.46),rgba(255,255,255,.14));border:2px solid rgba(255,255,255,.82);box-shadow:0 6px 18px rgba(0,0,0,.45),inset 0 2px 6px rgba(255,255,255,.5);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1;transition:transform .05s,background .05s}
.b.act{transform:scale(.88);background:rgba(255,214,10,.52);border-color:#ffd60a}
#bl{left:16px}#br{left:94px}#bj{right:16px;background:radial-gradient(circle at 30% 25%,rgba(255,105,90,.68),rgba(215,35,35,.32))}#ba{right:94px;font-size:22px;background:radial-gradient(circle at 30% 25%,rgba(255,220,40,.65),rgba(255,130,0,.3))}
#topb{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:5}
.tb{background:rgba(12,16,30,.75);color:#fff;border:1px solid rgba(255,214,10,.38);border-radius:10px;font-size:15px;padding:5px 13px;box-shadow:0 4px 12px rgba(0,0,0,.45)}
#ui{position:fixed;inset:0;background:var(--ov);overflow:auto;display:flex;flex-direction:column;align-items:center;padding:calc(14px + env(safe-area-inset-top,0px)) 12px 24px;gap:9px;touch-action:pan-y;text-align:center;z-index:8}
#ui h1{margin:2px 0 4px;font-size:30px;letter-spacing:.5px;background:linear-gradient(180deg,#fff 15%,#ffd60a 58%,#ff4d4d 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 10px rgba(255,60,60,.6))}
#ui h2{margin:2px 0;color:#ffd60a;text-shadow:0 2px 10px rgba(255,160,0,.45)}
#ui h3{margin:8px 0 2px;color:#72efdd;font-size:15px;text-transform:uppercase;letter-spacing:1.2px}
button.m,.row button{background:linear-gradient(180deg,#ff7b00,#e52521);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:12px;padding:10px 20px;font-size:16px;font-weight:800;min-width:230px;box-shadow:0 4px 0 #8f1111,0 8px 18px rgba(0,0,0,.45);cursor:pointer;transition:transform .07s}
button.m:active,.row button:active{transform:translateY(2px);box-shadow:0 2px 0 #8f1111}
.row{background:var(--pn);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:9px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;width:min(560px,94%);box-shadow:0 6px 16px rgba(0,0,0,.35)}
.row button{min-width:0;padding:7px 14px;font-size:14px;background:linear-gradient(180deg,#4cc9f0,#2563eb);box-shadow:0 3px 0 #1d4ed8}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:min(560px,94%)}
.grid button{background:var(--pn);color:var(--fg);border:2px solid rgba(255,255,255,.24);border-radius:11px;padding:8px 2px;font-size:16px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.5)}
.grid button.ok{background:linear-gradient(180deg,#38b000,#1b7a2b);color:#fff;border-color:#9ef01a;box-shadow:0 3px 0 #0f4c1a}.grid button:disabled{opacity:.35}
small{display:block;font-size:11px;opacity:.9;font-weight:500}
#rot{display:none;position:fixed;inset:0;z-index:12;background:radial-gradient(circle,#1e253d,#0b0e17);color:#fff;align-items:center;justify-content:center;font-size:20px;text-align:center}
@media(orientation:portrait){#rot{display:flex}}
</style></head><body>
<canvas id="c" width="800" height="400"></canvas>
<div id="ctl" style="display:none"><div id="bl" class="b">◀</div><div id="br" class="b">▶</div><div id="bj" class="b">⤒</div><div id="ba" class="b">—</div><div id="topb"><button id="snd" class="tb" onclick="togSnd()">🔊</button><button id="pz" class="tb" onclick="pause()">⏸</button></div></div>
<div id="ui"></div>
<div id="rot">📱 Gira tu teléfono<br>para jugar en horizontal</div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),W=800,H=400,GY=330;
const D=['Normal','Difícil','Extremo','Demoníaco'],MU=[1,1.5,2.5,4],SPD=[1,1.2,1.4,1.7],DEN=[1,.9,.8,.7];
const ITEMS=[['hat','🎩 Sombrero',60],['gaf','🕶️ Gafas',90],['cuer','😈 Cuernos',150],['capa','🦸 Capa',220],['cor','👑 Corona',400],['cAz','🔵 Color azul',100],['cVe','🟢 Color verde',100],['cOr','🟡 Color dorado',350],['cRo','💗 Color rosa',100],['cNe','⚫ Color negro',250],['tFu','🔥 Estela de fuego',300],['tAr','🌈 Estela arcoíris',500]];
const COL={cAz:'#3a7bff',cVe:'#2ecc71',cOr:'#f5c518',cRo:'#ff6fb5',cNe:'#2b2d42'};
const ABN={dash:'💨 Dash',inm:'⭐ Inmortalidad',mas:'🦘 Super masa'},ABC=[200,800,2000];
let S={coins:0,own:[],eq:[],ab:{dash:0,inm:0,mas:0},sel:'',done:{},best:{},inf:0,mute:0,stars:{},pas:{mag:0,esc:0}};
try{const x=JSON.parse(localStorage.getItem('bolita')||'{}');Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem('bolita',JSON.stringify(S))}catch(e){}};
const K={l:0,r:0,j:0,a:0,jp:0};let G=null,paused=1;

/* AUDIO LIGERO (Web Audio API) */
let AC=null,bgmT=0,bgmStep=0,rollT=0,activeVoices=0;
function initAudio(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{})}
function togSnd(){S.mute=S.mute?0:1;save();$('snd').textContent=S.mute?'🔇':'🔊';if(!S.mute)sfx('ui')}
function tone(f,f2,dur,type='sine',vol=.1,delay=0){if(S.mute||activeVoices>10)return;initAudio();if(!AC)return;
activeVoices++;
const t=AC.currentTime+delay,o=AC.createOscillator(),gn=AC.createGain();
o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(.001,t+dur);
o.connect(gn);gn.connect(AC.destination);o.start(t);o.stop(t+dur);
o.onended=()=>{activeVoices=Math.max(0,activeVoices-1)}}
function sfx(k){
if(k=='ui')tone(540,840,.07,'triangle',.08);
else if(k=='buy')[587,784,988,1174].forEach((n,i)=>tone(n,n*1.04,.1,'triangle',.1,i*.06));
else if(k=='err')tone(190,95,.15,'sawtooth',.1);
else if(k=='jmp'){tone(220,620,.14,'sine',.12);tone(440,880,.09,'triangle',.05,.03)}
else if(k=='jmpM'){tone(150,740,.22,'triangle',.14);tone(300,900,.14,'sine',.07,.02)}
else if(k=='dash'){tone(520,140,.15,'sawtooth',.11);tone(280,110,.15,'square',.07)}
else if(k=='pow')[523,659,784,1046,1318].forEach((n,i)=>tone(n,n*1.06,.11,'triangle',.1,i*.045));
else if(k=='aloe')[440,554,659,880,1108,1318].forEach((n,i)=>tone(n,n*1.1,.1,'sine',.11,i*.04));
else if(k=='brk'){tone(160,55,.12,'square',.1);tone(95,45,.12,'sawtooth',.08)}
else if(k=='kill'){tone(390,820,.09,'square',.1);tone(780,1180,.11,'triangle',.1,.05)}
else if(k=='hitB'){tone(240,75,.22,'sawtooth',.15);tone(110,55,.18,'sine',.14)}
else if(k=='die'){tone(320,65,.36,'sawtooth',.14);tone(160,45,.38,'triangle',.12,.05)}
else if(k=='win')[523,659,784,1046,1318,1568].forEach((n,i)=>tone(n,n*1.02,.14,'triangle',.12,i*.085));
}
const BGM=[
[[261.6,329.6,392,523.2,392,329.6,293.7,440],[130.8,130.8,196,196,146.8,146.8,220,196]],
[[220,277.2,329.6,440,329.6,277.2,246.9,370],[110,110,164.8,164.8,123.5,123.5,185,164.8]],
[[196,246.9,293.7,392,349.2,293.7,261.6,392],[98,98,146.8,146.8,130.8,130.8,196,174.6]],
[[146.8,174.6,220,293.7,207.6,174.6,146.8,233.1],[73.4,73.4,110,146.8,103.8,103.8,73.4,116.5]]
];
function tickBgm(){if(S.mute||!G||paused||G.dead||activeVoices>6)return;
const bs=G.B&&G.B.hp>0&&G.p.x>G.L-1100,iv=bs?10:(G.alt>0?10:14);
if(++bgmT>=iv){bgmT=0;const pair=BGM[bs?3:(G.sec-1)],idx=bgmStep++%8;
tone(pair[0][idx],pair[0][idx]*.99,.15,bs?'sawtooth':'triangle',bs?.036:.03);
if(idx%2==0)tone(pair[1][idx],pair[1][idx],.18,'sine',bs?.045:.035)}}

/* EFECTOS VISUALES LIGEROS */
let PT=[],FT=[],TR=[],shake=0,flash=0,flashCol='#fff';
function burst(x,y,c,n=10,spd=4.2,sz=4){for(let i=0;i<n;i++){if(PT.length>75)PT.shift();const a=Math.random()*6.2832,v=(.3+Math.random()*.8)*spd;
PT.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.3,c,s:sz*(.6+Math.random()*.7),l:20+Math.random()*14|0,ml:34,g:.18})}}
function floatTxt(x,y,t,c='#ffd60a'){if(FT.length>14)FT.shift();FT.push({x,y,t,c,l:46})}
function updFX(){
if(shake>0)shake=Math.max(0,shake-.85);
if(flash>0)flash=Math.max(0,flash-.055);
for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;if(--p.l<=0)PT.splice(i,1)}
for(let i=FT.length-1;i>=0;i--){const f=FT[i];f.y-=.75;if(--f.l<=0)FT.splice(i,1)}
for(let i=TR.length-1;i>=0;i--)if(--TR[i].l<=0)TR.splice(i,1)}
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('#ui button'))sfx('ui')});

const mb=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function rs(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}addEventListener('resize',rs);rs();

/* UI */
function show(h){$('ui').innerHTML=h;$('ui').style.display='flex';$('ctl').style.display='none';paused=1}
function hide(){$('ui').style.display='none';$('ctl').style.display='block';paused=0;$('snd').textContent=S.mute?'🔇':'🔊'}
function pause(){show('<h2>⏸ Pausa</h2><button class="m" onclick="hide()">Continuar</button><button class="m" onclick="restart()">🔄 Reiniciar</button><button class="m" onclick="menu()">Salir al menú</button>')}
function menu(){G=null;show(`<h1>🔴 Bolita Roja</h1><button class="m" onclick="play('i',0,0,1)">♾️ Modo infinito<small>Récord: ${S.inf|0}</small></button><button class="m" onclick="story()">📖 Modo historia<small>⭐ ${Array.from({length:30},(_,i)=>sg(i+1)).reduce((a,b)=>a+b,0)} / 90</small></button><button class="m" onclick="shop()">🛒 Tienda<small>🪙 ${S.coins}</small></button><small>Controles: ◀ ▶ a la izquierda · saltar y habilidad a la derecha<br>(teclado: flechas/AD, espacio, Shift)</small>`)}
function story(){let h='<h2>📖 Modo historia</h2><small>Jefe en la etapa 5 y 10 de cada sección (👹)</small>';
for(let s=0;s<3;s++){h+=`<h3>Sección ${s+1} · ${['🌿 Pradera Soleada','🌅 Cañón Atardecer','🌌 Noche Cósmica'][s]}</h3><div class="grid">`;for(let i=1;i<=10;i++){const n=s*10+i,lk=n>1&&!S.done[n-1];h+=`<button ${lk?'disabled':''} class="${S.done[n]?'ok':''}" onclick="pick(${n})">${i%5?'':'👹'}${n}<small>${'⭐'.repeat(sg(n))||'&nbsp;'}</small></button>`}h+='</div>'}
show(h+'<button class="m" onclick="menu()">← Volver</button>')}
function pick(n){if(!S.done[n])return play('s',n,0,1);let h=`<h2>Etapa ${n}</h2><small>Elige dificultad</small>`;D.forEach((d,i)=>h+=`<button class="m" onclick="play('s',${n},${i},1)">${d} ×${MU[i]}<small>Mejor: ${S.best[n+'_'+i]||0}</small></button>`);show(h+'<button class="m" onclick="story()">← Volver</button>')}
function desc(k,l){if(!l)return'';return k=='dash'?`Distancia ${Math.round((11+2*l)*12)} · enfriamiento ${(3.5-.5*l).toFixed(1)}s`:`Dura ${10+3*(l-1)}s`}
function shop(){let h=`<h2>🛒 Tienda</h2><b>🪙 ${S.coins}</b><h3>Habilidades</h3>`;
for(const k in ABN){const l=S.ab[k];h+=`<div class="row"><b>${ABN[k]}</b> Nv ${l}/3<small style="width:100%">${desc(k,l)||'Sin comprar'}</small>`;if(l<3)h+=`<button onclick="up('${k}')">${l?'Mejorar':'Comprar'} 🪙${ABC[l]}</button>`;if(l)h+=`<button onclick="selA('${k}')">${S.sel==k?'✔ Equipada':'Equipar'}</button>`;h+='</div>'}
h+='<h3>Pasivas</h3>';for(const k in PAS){const l=S.pas[k],mx=PAS[k][1].length;h+=`<div class="row"><b>${PAS[k][0]}</b> Nv ${l}/${mx}<small style="width:100%">${PAS[k][2]}</small>${l<mx?`<button onclick="upP('${k}')">${l?'Mejorar':'Comprar'} 🪙${PAS[k][1][l]}</button>`:''}</div>`}h+='<h3>Accesorios</h3>';ITEMS.forEach(([id,n,p])=>{const o=S.own.includes(id);h+=`<div class="row">${n}${o?`<button onclick="eqp('${id}')">${S.eq.includes(id)?'Quitar':'Equipar'}</button>`:`<button onclick="buy('${id}',${p})">🪙${p}</button>`}</div>`});
show(h+'<button class="m" onclick="menu()">← Volver</button>');}
function up(k){const c=ABC[S.ab[k]];if(S.coins<c){sfx('err');return toast('No te alcanzan las monedas')}sfx('buy');S.coins-=c;S.ab[k]++;if(!S.sel)S.sel=k;save();shop()}
function selA(k){sfx('ui');S.sel=k;save();shop()}
function buy(id,p){if(S.coins<p){sfx('err');return toast('No te alcanzan las monedas')}sfx('buy');S.coins-=p;S.own.push(id);eqp(id,1)}
function eqp(id,nr){if(!nr)sfx('ui');const i=S.eq.indexOf(id);if(i>=0)S.eq.splice(i,1);else{if(id[0]=='c'&&id!='cor')S.eq=S.eq.filter(x=>x[0]!='c'||x=='cor');if(id[0]=='t')S.eq=S.eq.filter(x=>x[0]!='t');S.eq.push(id)}save();shop()}
const PAS={mag:['🧲 Imán de monedas',[150,500,1200],'Atrae las monedas desde más lejos'],esc:['🛡️ Escudo inicial',[400],'Empiezas cada etapa con un escudo']};
function upP(k){const c=PAS[k][1][S.pas[k]];if(S.coins<c){sfx('err');return toast('No te alcanzan las monedas')}sfx('buy');S.coins-=c;S.pas[k]++;save();shop()}
const sg=n=>Math.max(0,...[0,1,2,3].map(d=>S.stars[n+'_'+d]||0));
function restart(){G.mode=='i'?play('i',0,0,1):play('s',G.n,G.d,1)}
function vib(n){try{if(!S.mute&&navigator.vibrate)navigator.vibrate(n)}catch(e){}}
function toast(t){const d=document.createElement('div');d.textContent=t;d.style.cssText='position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#e52521;color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;z-index:30;box-shadow:0 6px 16px rgba(0,0,0,.5)';document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
const VG=(()=>{const v=g.createRadialGradient(400,200,170,400,200,500);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.4)');return v})();
/* JUEGO */
function play(mode,n,d,att){initAudio();PT=[];FT=[];TR=[];shake=0;flash=0;K.jp=0;rollT=0;
const sec=mode=='i'?1:((n-1)/10|0)+1,st=(n-1)%10+1,boss=mode=='s'&&st%5==0;
G={mode,n,d,att,sec,st,boss,rng:mode=='i'?Math.random:mb(n*977+d*31),p:{x:80,y:GY-16,vx:0,vy:0,on:1,f:1,coy:0,jm:0,rot:0},cam:0,bl:[],lv:[],sp:[],en:[],pr:[],al:[],co:[],pl:[],spr:[],sh:[],shield:S.pas.esc?1:0,hurt:0,ct:0,banner:0,cn:0,cb:0,bo:0,jb:0,kills:0,t:0,inm:0,mas:0,alt:0,dash:0,cd:0,dead:0,B:null,L:mode=='i'?1e9:(boss?2100:2600+n*60),fl:!boss,genX:500};
const q=G;if(mode=='i')q.genX=gen(500,1400);else{gen(450,q.L-(boss?800:350));if(boss){const hp=Math.round(((st==10?7:4)+sec*2)*(1+.25*d));q.B={x:q.L-380,y:GY-80,w:80,h:80,vy:0,t:0,hp,mhp:hp,inv:0,chg:0,tel:0,cd:1,act:0}}}
q.ct=q.co.length;q.banner=att>1?45:120;hide();}
function mk(k,x){const q=G,s=k=='hex'?34:30,y=k=='rom'?200+q.rng()*60:GY-s;return{k,x,y,y0:y,w:s,h:s,hx:x,vx:(q.rng()<.5?-1:1)*1.3*SPD[q.d],vy:0,t:q.rng()*100|0,ch:0}}
function arc(x,w){for(let i=0;i<5;i++)G.co.push({x:x+w/2+(i-2)*28,y:GY-95-Math.sin(i/4*Math.PI)*45})}
function gen(x,x1){const q=G,r=q.rng,d=q.d,inf=q.mode=='i',dn=inf?Math.min(1,x/9000):(q.n-1)/30;
const ty=['sq','tri'];if(q.sec>1||(inf&&x>2500))ty.push('pen','rom');if(q.sec>2||(inf&&x>5000))ty.push('hex');
while(x<x1){const t=r();let w=40;
if(t<.18){const h=1+(r()<.4?1:0),c=1+(r()<.3?1:0);q.bl.push({x,y:GY-40*h,w:40*c,h:40*h});w=40*c;arc(x,w)}
else if(t<.30){w=90+r()*40;q.lv.push([x,w]);arc(x,w)}
else if(t<.42){w=60;q.sp.push({x,w});arc(x,w)}
else if(t<.46){q.al.push({x,y:GY-34,w:30,h:34})}
else if(t<.49)q.sh.push({x,y:GY-30,w:24,h:24});else if(t<.54)q.spr.push({x,y:GY-14,w:36,h:14});else if(t<.61){const py=GY-85-(r()*30|0);q.pl.push({x,y:py,w:120,h:12});w=120;for(let i=0;i<3;i++)q.co.push({x:x+20+i*40,y:py-22})}else q.en.push(mk(ty[r()*ty.length|0],x));
x+=w+Math.max(210,(300-dn*100)*DEN[d]*(.8+r()*.6))}return x}

function die(){if(G.hurt>0)return;if(G.shield&&!G.dead){G.shield=0;G.hurt=75;sfx('hitB');shake=8;flash=.3;flashCol='#72efdd';vib(40);burst(G.p.x,G.p.y,'#72efdd',16,5,4);floatTxt(G.p.x,G.p.y-30,'🛡️ ¡Escudo roto!','#72efdd');return}if(!G.dead){vib(90);G.dead=70;sfx('die');shake=12;flash=.42;flashCol='#ff1e1e';burst(G.p.x,G.p.y,'#ff4d4d',18,6.5,5)}}
function ab(){const q=G,k=S.sel,l=S.ab[k];if(q.dead||q.cd>0||!k||!l)return;
if(k=='dash'){q.dash=12;q.cd=Math.round((3.5-.5*l)*60);sfx('dash');shake=5;burst(q.p.x,q.p.y,'#72efdd',12,5,4.2)}

else if(e.k=='hex'){if(Math.abs(p.x-e.x)<320)e.ch=1;if(e.ch)e.x+=dr*3.2*sp}}

function upB(b){const q=G,p=q.p,sp=SPD[q.d]*(b.hp<=b.mhp/2?1.3:1);if(!b.act){if(p.x>b.x-650)b.act=1;else return}

for(let i=-1;i<8;i++){const x=i*160-(cam*.35%160);g.beginPath();g.moveTo(x,GY);g.lineTo(x+80,GY-95-(i&1)*35);g.lineTo(x+160,GY);g.fill()}

for(let i=0;i<12;i++){const px=((i*97-cam*.55+Math.sin(tm/26+i)*24)%W+W)%W,py=130+((i*57+Math.cos(tm/22+i)*18)%180);
g.fillStyle=sec==3?'rgba(155,246,255,.78)':(sec==2?'rgba(255,209,102,.68)':'rgba(255,255,255,.65)');
g.fillRect(px,py,3,3)}

g.fillStyle=c[4];g.fillRect(0,GY,W,H-GY);
g.fillStyle='rgba(0,0,0,.22)';for(let i=-1;i<18;i++){const rx=i*52-(cam%52);g.fillRect(rx+10,GY+18+(i%3)*14,18,8)}
g.fillStyle=c[3];g.fillRect(0,GY,W,12);g.fillStyle=c[2];g.fillRect(0,GY,W,6);
for(let i=-1;i<34;i++){const gx=i*24-(cam%24),sw=Math.sin(tm/12+i)*3;g.beginPath();g.moveTo(gx,GY);g.lineTo(gx+4+sw,GY-7);g.lineTo(gx+9,GY);g.fill();
if(sec==1&&i%6==0){g.fillStyle=i%12==0?'#ff595e':'#ffd60a';g.fillRect(gx+2+sw,GY-10,4,4);g.fillStyle=c[2]}}}

function draw(){g.clearRect(0,0,W,H);const q=G,now=Date.now()/16;
if(!q){bg(1,now*.65,now);const t=Date.now()/500;ball(400,GY-16-Math.abs(Math.sin(t))*90,16,1,1,now*.08);return}
const cam=q.cam,p=q.p,X=x=>x-cam;
g.save();if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
bg(q.sec,cam,q.t);

const shD=Math.max(0,1-(GY-16-p.y)/180);
if(shD>0){g.fillStyle=`rgba(0,0,0,${.32*shD})`;g.beginPath();g.ellipse(X(p.x),GY+2,(q.mas>0?20:16)*(.5+.5*shD),4*shD,0,0,7);g.fill()}

for(const l of q.lv){if(l[0]+l[1]<cam||l[0]>cam+W)continue;
g.fillStyle='#ff5400';g.fillRect(X(l[0]),GY,l[1],H-GY);
g.fillStyle='#ffd60a';for(let i=0;i<l[1];i+=14)g.fillRect(X(l[0])+i,GY+Math.sin(q.t/6.5+i)*3+2,9,4)}

for(const b of q.bl){if(b.d||b.x<cam-80||b.x>cam+W)continue;
g.fillStyle='#b07d44';g.fillRect(X(b.x),b.y,b.w,b.h);g.strokeStyle='#432818';g.lineWidth=2;
for(let i=0;i<b.w/40;i++)for(let j=0;j<b.h/40;j++){const bx=X(b.x)+i*40,by=b.y+j*40;
g.strokeRect(bx+1,by+1,38,38);g.beginPath();g.moveTo(bx+6,by+6);g.lineTo(bx+34,by+34);g.stroke()}}

for(const l of q.pl){if(l.x<cam-140||l.x>cam+W)continue;g.fillStyle='#8d5a2b';g.fillRect(X(l.x),l.y,l.w,l.h);g.fillStyle='#c68b59';g.fillRect(X(l.x),l.y,l.w,4);g.fillStyle='#432818';for(let i=12;i<l.w;i+=24)g.fillRect(X(l.x)+i,l.y+4,2,l.h-4)}
for(const s of q.spr){if(s.x<cam-60||s.x>cam+W)continue;const k=s.sq>0?(s.sq--,6):14;g.fillStyle='#4cc9f0';g.fillRect(X(s.x),GY-k,s.w,4);g.fillStyle='#94a3b8';g.fillRect(X(s.x)+6,GY-k+4,4,k-4);g.fillRect(X(s.x)+s.w-10,GY-k+4,4,k-4);g.fillStyle='#e63946';g.fillRect(X(s.x),GY-3,s.w,3)}
for(const s of q.sh){if(s.d||s.x<cam-40||s.x>cam+W)continue;const y=s.y+Math.sin(q.t/10)*3,x=X(s.x);g.fillStyle='rgba(114,239,221,.25)';g.beginPath();g.arc(x+12,y+12,17,0,7);g.fill();g.fillStyle='#72efdd';g.beginPath();g.moveTo(x+12,y);g.lineTo(x+22,y+5);g.lineTo(x+19,y+19);g.lineTo(x+12,y+24);g.lineTo(x+5,y+19);g.lineTo(x+2,y+5);g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke()}
for(const s of q.sp){if(s.d||s.x<cam-80||s.x>cam+W)continue;
for(let i=0;i<s.w;i+=20){g.fillStyle='#94a3b8';g.beginPath();g.moveTo(X(s.x)+i,GY);g.lineTo(X(s.x)+i+10,GY-23);g.lineTo(X(s.x)+i+20,GY);g.fill();
g.fillStyle='#fff';g.beginPath();g.moveTo(X(s.x)+i+10,GY-23);g.lineTo(X(s.x)+i+13.5,GY);g.lineTo(X(s.x)+i+10,GY);g.fill()}}

for(const a of q.al){if(a.d||a.x<cam-80||a.x>cam+W)continue;
g.fillStyle='rgba(116,198,157,.24)';g.beginPath();g.arc(X(a.x)+15,GY-16,26,0,7);g.fill();
g.fillStyle='#2d6a4f';for(const[dx,h]of[[-8,30],[0,36],[8,30]]){g.beginPath();g.moveTo(X(a.x)+15+dx-6,GY);g.lineTo(X(a.x)+15+dx*1.6,GY-h);g.lineTo(X(a.x)+15+dx+6,GY);g.fill()}
g.fillStyle='#95d5b2';g.beginPath();g.moveTo(X(a.x)+12,GY);g.lineTo(X(a.x)+15,GY-35);g.lineTo(X(a.x)+17,GY);g.fill()}

g.strokeStyle='#b8860b';g.lineWidth=2;for(const c of q.co){if(c.d||c.x<cam-20||c.x>cam+W+20)continue;
const cy=c.y+Math.sin(q.t/9+c.x)*2.5;g.fillStyle='#ffd60a';g.beginPath();g.arc(X(c.x),cy,7.5,0,7);g.fill();g.stroke();
g.fillStyle='#fff3b0';g.fillRect(X(c.x)-1.5,cy-4,3,8)}

if(q.L<1e8){g.fillStyle='#f8f9fa';g.fillRect(X(q.L),GY-124,5,124);g.fillStyle=q.fl?'#2ec4b6':'#6c757d';g.fillRect(X(q.L)+5,GY-124,44,28)}

for(const e of q.en){if(e.d||e.x<cam-80||e.x>cam+W)continue;const[n,r]=EN[e.k],cx=X(e.x)+e.w/2,cy=e.y+e.h/2;
poly(cx,cy,e.w*.62,n,EC[e.k],r+(e.k=='rom'?Math.sin(e.t/12)*.2:0));eye(cx,cy,e.w*.6)}

const b=q.B;if(b&&b.hp>0){const cx=X(b.x)+40,cy=b.y+40;
if(b.inv%8<4)poly(cx,cy,52,3+q.sec,b.tel>0&&q.t%6<3?'#ffffff':['#9b111e','#d95d39','#5a189a'][q.sec-1],q.sec==1?.785:0);
eye(cx,cy,48)}

for(const o of q.pr){g.fillStyle='#ffbe0b';g.beginPath();g.arc(X(o.x),o.y,7.5,0,7);g.fill();g.fillStyle='#ff5400';g.beginPath();g.arc(X(o.x),o.y,4,0,7);g.fill()}

for(const tr of TR){g.globalAlpha=Math.max(0,tr.l/tr.ml)*.5;g.fillStyle=tr.c;g.beginPath();g.arc(X(tr.x),tr.y,tr.r*(tr.l/tr.ml),0,7);g.fill()}
for(const o of PT){g.globalAlpha=Math.max(0,o.l/o.ml);g.fillStyle=o.c;g.fillRect(X(o.x)-o.s/2,o.y-o.s/2,o.s,o.s)}
g.globalAlpha=1;

const R=q.mas>0?20:16,imm=q.inm>0||q.alt>0||q.dash>0||q.hurt>0;
if(!q.dead||q.t%6<3){const sy=1+Math.min(.2,Math.abs(p.vy)/50)-(p.sq>0?.25*p.sq/8:0),fy=p.y+R;g.save();g.translate(X(p.x),fy);g.scale(1/sy,sy);g.translate(-X(p.x),-fy);ball(X(p.x),p.y,R,p.f,imm&&q.t%6<4,p.rot);g.restore();if(q.shield){g.strokeStyle='rgba(114,239,221,.9)';g.fillStyle='rgba(114,239,221,.16)';g.lineWidth=2.5;g.beginPath();g.arc(X(p.x),p.y,R+8,0,7);g.fill();g.stroke()}}

g.textAlign='center';g.font='bold 15px system-ui,sans-serif';g.lineWidth=3.5;g.strokeStyle='rgba(0,0,0,.85)';
for(const f of FT){g.globalAlpha=Math.min(1,f.l/20);g.fillStyle=f.c;g.strokeText(f.t,X(f.x),f.y);g.fillText(f.t,X(f.x),f.y)}
g.globalAlpha=1;g.restore();

if(flash>0){g.globalAlpha=flash;g.fillStyle=flashCol;g.fillRect(0,0,W,H);g.globalAlpha=1}

g.fillStyle=VG;g.fillRect(0,0,W,H);
if(q.banner>0){g.globalAlpha=Math.min(1,q.banner/25);g.textAlign='center';g.font='bold 34px system-ui,sans-serif';g.lineWidth=5;g.strokeStyle='rgba(0,0,0,.8)';g.fillStyle=q.boss?'#ff595e':'#ffd60a';const t1=q.mode=='i'?(q.zone?'🌄 ZONA '+q.sec:'♾️ MODO INFINITO'):'ETAPA '+q.n+(q.boss?' · ¡JEFE!':'');g.strokeText(t1,W/2,150);g.fillText(t1,W/2,150);g.font='bold 16px system-ui,sans-serif';g.fillStyle='#fff';const t2=q.mode=='i'?'¡Llega lo más lejos que puedas!':(q.n==1&&q.att==1?'◀ ▶ mover · ⤒ saltar (mantén = más alto) · pisa enemigos':['Pradera Soleada','Cañón Atardecer','Noche Cósmica'][q.sec-1]);g.strokeText(t2,W/2,176);g.fillText(t2,W/2,176);g.globalAlpha=1}
if(q.dead){g.textAlign='center';g.font='bold 22px system-ui,sans-serif';g.lineWidth=4;g.strokeStyle='rgba(0,0,0,.8)';g.fillStyle='#fff';const t=q.L<1e8?'💀 ¡Casi! Llegaste al '+Math.min(99,p.x/q.L*100|0)+'%':'💀 '+Math.floor(p.x/10)+' m';g.strokeText(t,W/2,205);g.fillText(t,W/2,205)}
g.fillStyle='#fff';g.strokeStyle='rgba(0,0,0,.8)';g.lineWidth=3.5;g.font='bold 14px system-ui,sans-serif';g.textAlign='left';
const sc=q.mode=='i'?Math.floor(p.x/10)+q.kills*50+q.bo:q.kills*100+q.bo;
const tx=(s,x,y)=>{g.strokeText(s,x,y);g.fillText(s,x,y)};
tx(q.mode=='i'?'♾️ Infinito':`Etapa ${q.n} · ${D[q.d]} · Intento ${q.att}`,12,21);
tx(`Puntos: ${sc}   🪙 ${S.coins}  (+${q.cn} recogidas)`+(q.cb>1?`   🔥 x${q.cb}`:''),12,39);
let tm=[];if(q.inm>0)tm.push('⭐ '+Math.ceil(q.inm/60)+'s');if(q.mas>0)tm.push('🦘 '+Math.ceil(q.mas/60)+'s');if(q.alt>0)tm.push('🌿 '+Math.ceil(q.alt/60)+'s');if(tm.length)tx(tm.join('  '),12,57);
if(b&&b.hp>0){g.fillStyle='rgba(0,0,0,.75)';g.fillRect(200,46,400,11);g.fillStyle='#ff2a2a';g.fillRect(202,48,396*b.hp/b.mhp,7);
if(p.x>q.L-1300){g.textAlign='center';g.fillStyle='#fff';tx('¡Derrota al jefe saltándole encima!',W/2,76)}}
if(q.L<1e8){g.fillStyle='rgba(0,0,0,.45)';g.fillRect(200,H-10,400,5);g.fillStyle='#ffd60a';g.fillRect(200,H-10,400*Math.min(1,p.x/q.L),5)}
$('ba').textContent=S.sel?(q.cd>0?Math.ceil(q.cd/60):{dash:'💨',inm:'⭐',mas:'🦘'}[S.sel]):'—'}
/* ENTRADA */
[['bl','l'],['br','r'],['bj','j'],['ba','a']].forEach(([i,k])=>{const e=$(i);
e.onpointerdown=v=>{v.preventDefault();initAudio();K[k]=1;if(k=='j')K.jp=1;e.classList.add('act')};
['pointerup','pointercancel','pointerleave'].forEach(n=>e['on'+n]=()=>{if(k!='a')K[k]=0;e.classList.remove('act')})});
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'j',w:'j',' ':'j',Shift:'a',e:'a',x:'a'};
addEventListener('keydown',e=>{const k=KM[e.key];if(k){if(k=='j'&&!e.repeat)K.jp=1;K[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k&&k!='a')K[k]=0});
let last=0,acc=0;
function loop(t){if(!last)last=t;const dt=Math.min(100,t-last);last=t;acc+=dt;if(acc>50)acc=50;
let steps=0;while(acc>=16.67&&steps<2){acc-=16.67;steps++;if(G&&!paused)upd()}draw();requestAnimationFrame(loop)}
$('snd').textContent=S.mute?'🔇':'🔊';
menu();requestAnimationFrame(loop);
</script>
